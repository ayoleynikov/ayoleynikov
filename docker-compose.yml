services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: pulse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - pulse_ch_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_DEBUG: "false"
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
      PULSE_CLICKHOUSE_HOST: clickhouse
      PULSE_CLICKHOUSE_PORT: "8123"
      PULSE_CLICKHOUSE_DB: pulse
      PULSE_API_HOST: "0.0.0.0"
      PULSE_API_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "pulse.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "source.discovery,source.poll,source.fetch,source.stream,ingestion.normalize,ingestion.dedupe,matching.brand,processing.ai,analytics.aggregate,alerts.dispatch,maintenance.cleanup,dead_letter",
      ]
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
      PULSE_CLICKHOUSE_HOST: clickhouse
      PULSE_CLICKHOUSE_PORT: "8123"
      PULSE_CLICKHOUSE_DB: pulse
      PULSE_RSS_FEEDS: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  jetstream:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pulse-jetstream"]
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pulse_pg_data:
  pulse_ch_data:
