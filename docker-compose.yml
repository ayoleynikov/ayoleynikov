services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_DEBUG: "false"
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
      PULSE_API_HOST: "0.0.0.0"
      PULSE_API_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "celery",
        "-A",
        "pulse.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "source.poll",
      ]
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
      PULSE_RSS_FEEDS: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jetstream:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pulse-jetstream"]
    env_file:
      - .env.example
    environment:
      PULSE_ENV: development
      PULSE_POSTGRES_HOST: postgres
      PULSE_POSTGRES_PORT: "5432"
      PULSE_POSTGRES_USER: pulse
      PULSE_POSTGRES_PASSWORD: pulse
      PULSE_POSTGRES_DB: pulse
      PULSE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pulse_pg_data:
